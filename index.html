<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kastled - Chess Redefined</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kastledNavy: '#0B132B',
                        kastledGold: '#E5A93C',
                        kastledGoldHover: '#d49830',
                        kastledBoardDark: '#4A5568',
                        kastledBoardLight: '#CBD5E0'
                    }
                }
            }
        }
    </script>
    <style>
        .gold-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #E5A93C, transparent);
        }
        .board-border {
            border: 4px solid #E5A93C;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-kastledNavy text-white min-h-screen font-sans flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('landing')">
            <!-- Official Kastled Paid Logo -->
            <img src="assets/Logo new.png" alt="Kastled Logo" class="h-10 w-auto object-contain" onerror="this.onerror=null; this.src='assets/logo.png';">
        </div>
        <nav class="hidden md:flex items-center space-x-8 text-gray-300">
            <a href="#" onclick="switchView('landing')" class="hover:text-kastledGold transition">Learn</a>
            <a href="#" onclick="checkAuthAndSwitch('dashboard')" class="hover:text-kastledGold transition">Play</a>
            <a href="#" onclick="switchView('dashboard')" class="hover:text-kastledGold transition">Puzzles</a>
            <a href="#" class="hover:text-kastledGold transition">Clans</a>
        </nav>
        <div class="flex items-center space-x-4">
            <button onclick="openAuthModal('login')" class="px-5 py-2 rounded-full border border-gray-600 hover:border-kastledGold text-sm font-semibold transition">Log In</button>
            <button onclick="openAuthModal('signup')" class="px-5 py-2 rounded-full bg-kastledGold text-kastledNavy font-bold text-sm hover:bg-kastledGoldHover transition shadow-lg">SIGN UP</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4">

        <!-- VIEW 1: LANDING PAGE -->
        <section id="view-landing" class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center py-8">
            <div class="flex justify-center">
                <div class="board-border rounded-lg p-2 bg-gray-900 inline-block">
                    <div id="landing-board" class="grid grid-cols-8 w-[340px] h-[340px] sm:w-[420px] sm:h-[420px]"></div>
                </div>
            </div>
            <div class="text-center lg:text-left space-y-6">
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-tight">
                    Experience Chess.<br><span class="text-kastledGold">Redefined on Kastled.</span>
                </h1>
                <p class="text-gray-300 text-lg max-w-xl">
                    Join a premium community where strategy meets sophistication. Over <strong>10 million</strong> players trust Kastled.
                </p>
                <div class="gold-divider my-4"></div>
                <div>
                    <button onclick="checkAuthAndSwitch('dashboard')" class="w-full sm:w-auto px-10 py-4 rounded-full bg-kastledGold text-kastledNavy font-black text-lg hover:bg-kastledGoldHover transition shadow-2xl tracking-wider">
                        Get Started
                    </button>
                </div>
            </div>
        </section>

        <!-- VIEW 2: SAVED GAMES & IMPORT DASHBOARD -->
        <section id="view-dashboard" class="w-full max-w-5xl mx-auto hidden space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-center bg-gray-900/
